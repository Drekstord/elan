# Test du serveur ÉLAN (dossier serveur) sur une machine Linux avec Docker, comme un NAS :
# image construite, « docker compose up », comptes, cloisonnement, synchro de l'app, fichiers,
# redémarrage, sauvegarde. Voir .github/scripts/tester-serveur.sh.
# Aucun secret nécessaire : le serveur de test est jetable.
name: Serveur ÉLAN

on:
  push:
    paths:
      - 'serveur/**'
      - 'lib/core/backend/**'
      - 'lib/core/sync/**'
      - 'test/server/**'
      - '.github/scripts/tester-serveur.sh'
      - '.github/workflows/serveur.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Avant le serveur : le cache de Flutter parcourt le dépôt, dont les données du serveur de test.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Démarrage du serveur
        run: bash .github/scripts/tester-serveur.sh demarrer

      - name: Comptes, cloisonnement, synchro, fichiers
        run: bash .github/scripts/tester-serveur.sh verifier

      - name: Code de l'app contre le serveur
        run: flutter test --tags serveur --run-skipped test/server

      - name: Redémarrage, sauvegarde, suppression d'un compte
        run: bash .github/scripts/tester-serveur.sh durer

      - name: Journaux du serveur
        if: failure()
        working-directory: serveur
        run: docker compose ps -a && docker compose logs --tail=150

      - name: Arrêt et effacement du serveur de test
        if: always()
        working-directory: serveur
        run: docker compose down -v && sudo rm -rf donnees
