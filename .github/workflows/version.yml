# Fichiers d'une version, construits à chaque étiquette (v2.8.0…) et joints à la release :
#   ELAN-vX.apk                    app Android
#   ELAN-Installation-vX.exe       installateur Windows (un seul fichier)
#   ELAN-serveur-vX.zip            serveur personnel : le guide et le dossier « elan » à déposer sur le NAS
# et l'image Docker du serveur, publiée sur ghcr.io/drekstord/elan-serveur (NAS Intel/AMD et ARM).
# Aussi à la main, sans release : onglet Actions > Version > Run workflow (fichiers dans l'onglet Actions).
#
# Secrets du dépôt requis (Settings > Secrets and variables > Actions), voir docs/INSTALLATION.md :
# (Aucun serveur n'est intégré à l'app publiée : chacun saisit le sien dans l'app, écran « Serveur ».)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                              clé de signature : la même que celle de l'app déjà installée,
#                                              sinon Android refuse la mise à jour.
# Ne tourne que dans le dépôt public Drekstord/elan (voir scripts/publier.sh) : dans le dépôt de
# travail privé, les tâches sont ignorées.
#
# Sécurité de la chaîne de publication :
#   - chaque action tierce est figée sur l'empreinte d'un commit (« @<sha> # vX.Y.Z ») : une
#     étiquette déplacée par un pirate ne changerait rien ici. Pour mettre une action à jour :
#     gh api repos/<action>/commits/<étiquette> -q .sha, puis remplacer l'empreinte et le commentaire ;
#   - chaque tâche n'a que les droits dont elle a besoin ;
#   - la clé de signature Android n'existe sur le disque que le temps de la construction.
name: Version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  android:
    if: github.repository == 'Drekstord/elan'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      # La clé n'est écrite qu'ici, après les tests, et effacée dès l'APK construit.
      - name: Clé de signature (depuis les secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : sans la bonne clé, le téléphone refuserait la mise à jour."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/elan-signature.jks
          {
            echo "storeFile=elan-signature.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Construction de l'APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "ELAN-${GITHUB_REF_NAME}.apk"

      - name: Effacement de la clé de signature
        if: always()
        run: rm -f android/app/elan-signature.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ELAN-${{ github.ref_name }}.apk
          retention-days: 30

  windows:
    if: github.repository == 'Drekstord/elan'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Construction de l'app Windows
        run: |
          flutter pub get
          flutter build windows --release

      # Sans ces bibliothèques de Microsoft (souvent déjà présentes, pas toujours), l'app ne démarre pas.
      - name: Bibliothèques C++ de Microsoft jointes à l'app
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'Bibliothèques C++ introuvables' }
          Copy-Item "$crt\msvcp140*.dll", "$crt\vcruntime140*.dll" build\windows\x64\runner\Release\
          Get-ChildItem build\windows\x64\runner\Release\*.dll | Select-Object Name

      - name: Installateur
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DVersion=$version" "/DSource=$PWD\build\windows\x64\runner\Release" scripts\windows\elan.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup : erreur $LASTEXITCODE" }
          Move-Item "dist\ELAN-Installation-v$version.exe" "ELAN-Installation-$env:GITHUB_REF_NAME.exe"

      - name: Essai de l'installateur (installation silencieuse, lancement, désinstallation)
        run: |
          Start-Process ".\ELAN-Installation-$env:GITHUB_REF_NAME.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/TASKS=bureau' -Wait
          $app = "$env:LOCALAPPDATA\Programs\ELAN"
          foreach ($f in 'elan.exe', 'flutter_windows.dll', 'vcruntime140.dll', 'data\flutter_assets\AssetManifest.bin') {
            if (-not (Test-Path "$app\$f")) { throw "$f manquant après installation" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ÉLAN.lnk")) { throw 'raccourci du menu Démarrer manquant' }
          $p = Start-Process "$app\elan.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "ÉLAN s'est arrêté au lancement (code $($p.ExitCode))" }
          Stop-Process $p
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if (Test-Path "$app\elan.exe") { throw 'désinstallation incomplète' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ELAN-Installation-${{ github.ref_name }}.exe
          retention-days: 30

  # Image Docker du serveur personnel. Étiquettes : « 1 » (celle du docker-compose.yml fourni :
  # version du protocole entre l'app et le serveur), le numéro de version et « latest ».
  # Le test complet du serveur est fait par le workflow « Serveur ÉLAN ».
  image-serveur:
    if: github.repository == 'Drekstord/elan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Numéro de version
        id: version
        run: |
          numero=$(sed -nE 's/^version: *([0-9.]+).*/\1/p' pubspec.yaml)
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: serveur/image
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/drekstord/elan-serveur:1
            ghcr.io/drekstord/elan-serveur:${{ steps.version.outputs.numero }}
            ghcr.io/drekstord/elan-serveur:latest

  publication:
    needs: [android, windows, image-serveur]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publier la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ce que reçoit la personne qui installe le serveur : le guide (une page à ouvrir dans le
      # navigateur) et le dossier « elan » à déposer tel quel sur le NAS.
      - name: Paquet du serveur personnel (NAS)
        run: |
          paquet="paquet/ELAN-serveur-${GITHUB_REF_NAME}"
          mkdir -p "$paquet/elan/donnees"
          cp serveur/docker-compose.yml "$paquet/elan/"
          printf '%s\r\n' \
            "Ce dossier contient les données de ton serveur ÉLAN : comptes, courses, photos, justificatifs." \
            "Ne supprime et ne modifie rien ici. Pense à inclure ce dossier dans la sauvegarde de ton NAS." \
            > "$paquet/elan/donnees/A LIRE.txt"
          docker run --rm -v "$PWD:/data" \
            pandoc/core:3.11@sha256:62518bfb6833705dc90a1634d8d879299bd820b3f74ad3b32fba8b618452553a serveur/LISEZMOI.md \
            --standalone --embed-resources --from gfm --to html5 \
            --metadata lang=fr --metadata pagetitle="Guide du serveur ÉLAN" \
            --include-in-header .github/scripts/guide-style.html \
            --output "$paquet/Guide du serveur ELAN.html"
          (cd paquet && zip -qr "../ELAN-serveur-${GITHUB_REF_NAME}.zip" .)
          unzip -l "ELAN-serveur-${GITHUB_REF_NAME}.zip"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serveur
          path: ELAN-serveur-${{ github.ref_name }}.zip
          retention-days: 30

      - name: Publication dans la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ELAN-${{ github.ref_name }}.apk
            ELAN-Installation-${{ github.ref_name }}.exe
            ELAN-serveur-${{ github.ref_name }}.zip
          generate_release_notes: true
