# Serveur ÉLAN : tes courses, photos et justificatifs, chez toi.
#
#   Démarrer : docker compose up -d
#   Vérifier : ouvrir http://ADRESSE-DU-NAS:8000 dans un navigateur
#   Arrêter  : docker compose down      (les données restent dans le dossier « donnees »)
#
# Rien d'autre à préparer. Guide pas à pas : « Guide du serveur ELAN.html », fourni avec ce dossier.

services:
  elan:
    image: ghcr.io/drekstord/elan-serveur:1
    container_name: elan
    restart: unless-stopped
    ports:
      # À gauche, le port ouvert sur le NAS : à changer si 8000 est déjà pris (par exemple "8010:8000").
      - "8000:8000"
    volumes:
      # Toutes tes données, dans un dossier « donnees » à côté de ce fichier. C'est lui qu'on sauvegarde.
      - ./donnees:/donnees
