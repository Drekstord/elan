# =====================================================================
# ÉLAN : serveur auto-hébergé (Supabase réduit à ce qu'utilise l'app)
#
#   Démarrer : docker compose up -d
#   Arrêter  : docker compose down        (les données restent dans ./donnees)
#   Journaux : docker compose logs -f
#
# Guide complet : LISEZMOI.md, à côté de ce fichier.
#
# Services :
#   api         porte d'entrée unique (port 8000) : app ÉLAN + tableau de bord
#   db          base PostgreSQL
#   auth        comptes et connexion
#   rest        lecture/écriture des courses
#   storage     photos et justificatifs
#   meta+studio tableau de bord d'administration (créer les comptes)
#   migrations  met la base à jour au démarrage, puis s'arrête
#   sauvegarde  copie de la base chaque nuit dans ./donnees/sauvegardes
#
# Versions des images : celles de la composition officielle de Supabase
# (github.com/supabase/supabase, dossier docker), septembre 2026.
# =====================================================================

name: elan

services:

  api:
    image: kong/kong:3.9.3
    restart: unless-stopped
    ports:
      - ${PORT:-8000}:8000/tcp
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./systeme/kong.yml:/home/kong/temp.yml:ro,z
      - ./systeme/kong.sh:/home/kong/kong.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Photos et justificatifs : 10 Mo par fichier côté app, marge pour l'envoi.
      KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE: 20m
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong.sh"]

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      # Mots de passe des comptes internes et durée des sessions (premier démarrage).
      - ./systeme/init-base.sql:/docker-entrypoint-initdb.d/init-scripts/99-elan.sql:Z
      # Les données de la base.
      - ./donnees/base:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
      TZ: ${TZ:-Europe/Paris}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${ADRESSE_SERVEUR}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${ADRESSE_SERVEUR}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${ADRESSE_SERVEUR}/auth/v1
      # Comme sur le serveur ÉLAN en ligne : connexion par e-mail et mot de passe,
      # inscriptions fermées, comptes créés dans le tableau de bord. Aucun e-mail envoyé.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${ADRESSE_SERVEUR}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      # L'app n'utilise pas les miniatures calculées par le serveur.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      # Les photos et justificatifs.
      - ./donnees/fichiers:/var/lib/storage:z

  meta:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: ÉLAN
      DEFAULT_PROJECT_NAME: ÉLAN
      SUPABASE_URL: http://api:8000
      SUPABASE_PUBLIC_URL: ${ADRESSE_SERVEUR}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  # Met la base au niveau de l'app : applique une fois chaque fichier de systeme/migrations.
  migrations:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./systeme/migrations:/migrations:ro,z
      - ./systeme/migrer.sh:/migrer.sh:ro,z
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/migrer.sh"]

  # Copie de la base chaque nuit ; garde les plus récentes.
  sauvegarde:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./donnees/sauvegardes:/sauvegardes:z
      - ./systeme/sauvegarder.sh:/sauvegarder.sh:ro,z
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HEURE_SAUVEGARDE: ${HEURE_SAUVEGARDE:-03:00}
      SAUVEGARDES_A_GARDER: ${SAUVEGARDES_A_GARDER:-14}
      TZ: ${TZ:-Europe/Paris}
    entrypoint: ["/bin/sh", "/sauvegarder.sh"]

volumes:
  db-config:
